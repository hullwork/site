# gitleaks configuration: default rules plus this repository's exemptions.
#
# gitleaks answers "is there a credential in the history". It is deliberately
# blind to the other half of the problem: a private cloud account or instance
# identifier -- an OSS bucket named after the account UID, an RDS instance
# endpoint -- has no entropy and no credential shape, so gitleaks reports the
# tree clean while it still names the operator's account. That half is guarded
# by test_cloud_identifiers.py. Neither check substitutes for the other; a green
# gitleaks run is not evidence that no private infrastructure remains.
title = "site"

[extend]
useDefault = true

# generic-api-key fires on the *source text* of a Python keyword argument --
# `subject=acting`, `subject=SUBJECT` -- in two test modules. Both sides are
# identifiers: the value is a variable the test itself just created through the
# API, never a literal.
#
# All three conditions are exact on purpose. Allowlisting the files wholesale
# would silently cover a real credential added to them later, and allowlisting
# `subject=<any identifier>` would also cover `subject=sk_live_...`, which is a
# perfectly good identifier. Spelling out the two names means a third one fails
# the scan and someone looks at it.
#
# The earlier version of this block never applied: it anchored the path as
# `^test_tenancy\.py$` while gitleaks reports `tests/test_tenancy.py`, and under
# condition = "AND" one unmatched clause disables the whole entry. It was
# written, committed, and inert -- the scan it was meant to quiet had been
# failing ever since, and the three findings in test_mcp_http.py were never
# covered at all.
[[allowlists]]
description = "Python keyword arguments in tests, not credential values"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/test_(tenancy|mcp_http)\.py$''']
regexTarget = "secret"
regexes = ['''^subject=(acting|SUBJECT)$''']
