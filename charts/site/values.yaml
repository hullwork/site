# The Pod network of the cluster this release is installed on. Required, with no
# default on purpose: three NetworkPolicy rules below are written as "allow
# 0.0.0.0/0 except this", so a wrong value excludes nothing and the rules quietly
# allow everyone -- without failing and without looking wrong in `kubectl get
# netpol`. Shipping a default would keep that as the unconfigured behaviour.
# Find it with: kubectl cluster-info dump | grep -m1 cluster-cidr
# See docs/CONFIGURATION.md.
clusterNetwork:
  podCIDR: ""

service:
  type: ClusterIP
  nodePort: null

storage:
  storageClass: standard

localPathProvisioner:
  enabled: false

postgresql:
  embedded:
    enabled: true

database:
  host: sites-postgres
  runtimeHost: ""
  port: 5432
  name: sites
  user: sites

# Node-reachable address for images produced by the optional build plane. A
# multi-node or remote cluster must point this at its registry mirror/route.
registry:
  pullHost: localhost:5000

# site never creates credential material. Create these Secrets before
# installing the Chart; scripts/bootstrap-standalone-secrets.sh is a safe local
# development helper. Key names are configurable for external secret managers.
existingSecrets:
  api:
    name: sites-api-token
    tokenKey: token
    consoleSessionKey: console-session-key
  database:
    name: sites-postgres-auth
    usernameKey: username
    databaseKey: database
    passwordKey: password
  registry:
    name: sites-registry-auth
    passwordKey: password
    htpasswdKey: htpasswd
  objectStorage:
    name: sites-oss-auth
    accessKeyIdKey: access-key-id
    accessKeySecretKey: access-key-secret

buildPlane:
  enabled: true

gateway:
  enabled: false
  serviceType: LoadBalancer
  httpNodePort: null
  metricsNodePort: null

monitoring:
  enabled: false

# The agent-facing MCP tool surface at POST /mcp on the control-plane API. On by
# default: it is a second spelling of the same authenticated /v1/* requests and grants
# no capability the caller's credential does not already have, so defaulting it off
# would not narrow a trust boundary - it would only make an agent host's tools silently
# absent until somebody found this flag.
mcpEndpoint:
  enabled: true

# Optional dependency-free OTLP/HTTP JSON tracing. Empty/disabled means no exporter
# thread and preserves standalone operation with only trace-id log correlation.
tracing:
  enabled: false
  endpoint: ""
  queueSize: 2048
  batchSize: 128
  flushSeconds: 1
  timeoutSeconds: 2
