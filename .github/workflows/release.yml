name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release-context:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify annotated main tag and project version
        env: {RELEASE_TAG: '${{ github.ref_name }}'}
        run: |
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" origin/main
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}'
          PY

  image:
    needs: release-context
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/site-control:staging-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Gate staging image with Trivy vulnerability and secret scanners
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/site-control@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  image-promote:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Promote scanned digest to release tag and sign it
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/site-control"
          staging_ref="$repository:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@$IMAGE_DIGEST"
          release_ref="$repository:$RELEASE_TAG"
          docker buildx imagetools create --tag "$release_ref" "$staging_ref"
          cosign sign --yes "$repository@$IMAGE_DIGEST"
      - name: Record immutable image identity
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          jq -n --arg repository "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/site-control" \
            --arg digest "$IMAGE_DIGEST" \
            '{component:"control",valuePath:"images.control",repository:$repository,digest:$digest,immutableRef:($repository+"@"+$digest),trivyGate:true,cosignSigned:true}' \
            >image-control.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image
          path: image-control.json

  helm-chart:
    needs: [release-context, image-promote]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-image
          path: release
      - name: Lint, render, and package chart
        env: {RELEASE_TAG: '${{ github.ref_name }}'}
        run: |
          uv run --locked --extra dev python scripts/prepare-release-chart.py prepare \
            --chart charts/site \
            --image-json release/image-control.json \
            --output-chart "$RUNNER_TEMP/site-chart" \
            --values-output "release/site-values-${RELEASE_TAG#v}.yaml"
          # clusterNetwork.podCIDR has no default in the chart, so this render
          # has to supply one. It is a smoke render used to verify image
          # pinning, not an install, so the reference value is fine here; a
          # real install supplies the CIDR of its own cluster.
          helm lint "$RUNNER_TEMP/site-chart" --set-string clusterNetwork.podCIDR=10.201.0.0/16
          helm template site "$RUNNER_TEMP/site-chart" \
            --set-string clusterNetwork.podCIDR=10.201.0.0/16 >release/site-rendered.yaml
          uv run --locked --extra dev python scripts/prepare-release-chart.py verify \
            --rendered release/site-rendered.yaml \
            --image-json release/image-control.json
          helm package "$RUNNER_TEMP/site-chart" --destination release
      - name: Publish immutable OCI chart and metadata
        env: {RELEASE_TAG: '${{ github.ref_name }}'}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          push_output="$(helm push release/site-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts")"
          printf '%s\n' "$push_output"
          chart_digest="$(printf '%s\n' "$push_output" | sed -n 's/^Digest: //p' | tail -1)"
          test -n "$chart_digest"
          chart_file="$(printf '%s\n' release/site-*.tgz)"
          chart_checksum="sha256:$(sha256sum "$chart_file" | awk '{print $1}')"
          values_file="site-values-${RELEASE_TAG#v}.yaml"
          values_checksum="sha256:$(sha256sum "release/$values_file" | awk '{print $1}')"
          jq -n \
            --arg name site \
            --arg version "${RELEASE_TAG#v}" \
            --arg url "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/site" \
            --arg digest "$chart_digest" \
            --arg chartFile "${chart_file#release/}" \
            --arg chartChecksum "$chart_checksum" \
            --arg valuesFile "$values_file" \
            --arg valuesChecksum "$values_checksum" \
            --slurpfile controlImage release/image-control.json \
            '{schemaVersion:1,name:$name,version:$version,package:{type:"helm-oci",url:$url,digest:$digest,immutableRef:($url+"@"+$digest)},artifacts:{chart:{filename:$chartFile,sha256:$chartChecksum},digestPinnedValues:{filename:$valuesFile,sha256:$valuesChecksum}},runtimeImages:{publishedByThisWorkflow:true,images:$controlImage}}' \
            >release/package-metadata.json
          (cd release && sha256sum -- *.{json,tgz,yaml} >SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: release/

  github-release:
    needs: helm-chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: release
      - name: Publish draft GitHub release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release create "${{ github.ref_name }}" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft
